<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collab Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="p-4 border-b border-gray-200 bg-white flex items-center justify-center shadow-sm">
    <h1 class="text-xl font-bold tracking-tight text-indigo-600">COLLAB FORM</h1>
  </div>
  
  <div class="p-4">
    <p class="text-sm text-gray-600 text-center mb-4">Collaborate on this form</p>

    <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 mb-4">
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Add Team Member</h2>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Member Role</label>
          <input type="text" id="role-input" value="Member" class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Member Email</label>
          <input type="email" id="email-input" class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="teammate@example.com" />
          <p id="email-error" class="text-xs text-red-500 mt-1 hidden"></p>
        </div>

        <button id="add-member-btn" class="w-full bg-indigo-50 text-indigo-700 font-medium text-sm py-2 px-4 rounded-md hover:bg-indigo-100 transition flex items-center justify-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          Add Member
        </button>
      </div>
    </div>

    <div>
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Team Members</h2>
      <div id="members-list" class="space-y-2 mb-4">
        <!-- Members will be injected here -->
        <p id="empty-state" class="text-xs text-gray-400 text-center py-4 bg-gray-100 rounded border border-dashed border-gray-300">No members added yet.</p>
      </div>
    </div>

    <div id="status-message" class="text-xs text-center font-medium p-2 mb-4 rounded hidden"></div>

    <button id="send-invites-btn" class="w-full bg-indigo-600 text-white font-medium text-sm py-2.5 px-4 rounded-md hover:bg-indigo-700 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
      Send Invitations
    </button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
